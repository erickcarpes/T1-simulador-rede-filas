# Modelo do T1: rede de 3 filas, vazias no inicio, 1a chegada em t = 2.0 e
# parada em 100.000 aleatorios. A probabilidade que falta em cada fila sai da
# rede (exterior).
!PARAMETERS

arrivals:
   F1: 2.0

queues:
   F1:
      servers: 1
      minArrival: 2.0
      maxArrival: 4.0
      minService: 1.0
      maxService: 2.0
   F2:
      servers: 2
      capacity: 5
      minService: 4.0
      maxService: 6.0
   F3:
      servers: 2
      capacity: 10
      minService: 5.0
      maxService: 15.0

network:
-  source: F1
   target: F2
   probability: 0.2
-  source: F1
   target: F3
   probability: 0.8
-  source: F2
   target: F1
   probability: 0.3
-  source: F2
   target: F3
   probability: 0.5
-  source: F3
   target: F2
   probability: 0.7

rndnumbersPerSeed: 100000
seeds:
- 42
