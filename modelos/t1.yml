#==============================================================================
#  T1 | Simulador para Rede de Filas
#  Fila 1: G/G/1 (capacidade infinita), chegadas 2..4, atendimento 1..2
#          roteamento: 0,2 -> F2 | 0,8 -> F3
#  Fila 2: G/G/2/5, atendimento 4..6
#          roteamento: 0,3 -> F1 | 0,5 -> F3 | 0,2 -> exterior (restante)
#  Fila 3: G/G/2/10, atendimento 5..15
#          roteamento: 0,7 -> F2 | 0,3 -> exterior (restante)
#
#  Convencao de saida da rede: a probabilidade restante de cada fila vai para
#  o exterior (mesma convencao do simulador de referencia do modulo 3).
#  Parada: 100.000 numeros aleatorios.
#==============================================================================
!PARAMETERS

arrivals:
   F1: 2.0

queues:
   F1:
      servers: 1
      minArrival: 2.0
      maxArrival: 4.0
      minService: 1.0
      maxService: 2.0
   F2:
      servers: 2
      capacity: 5
      minService: 4.0
      maxService: 6.0
   F3:
      servers: 2
      capacity: 10
      minService: 5.0
      maxService: 15.0

network:
-  source: F1
   target: F2
   probability: 0.2
-  source: F1
   target: F3
   probability: 0.8
-  source: F2
   target: F1
   probability: 0.3
-  source: F2
   target: F3
   probability: 0.5
-  source: F3
   target: F2
   probability: 0.7

rndnumbersPerSeed: 100000
seeds:
- 42
